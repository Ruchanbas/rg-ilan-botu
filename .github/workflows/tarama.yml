name: ilan taramasi

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklar
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Sertifika teshisi
        run: |
          echo "=== Sunucunun sundugu zincir ==="
          echo | openssl s_client -connect www.ilan.gov.tr:443 \
            -servername www.ilan.gov.tr -showcerts 2>/dev/null \
            | grep -E "s:|i:" || true
          echo "=== Issuer URL (eksik ara sertifika) ==="
          echo | openssl s_client -connect www.ilan.gov.tr:443 \
            -servername www.ilan.gov.tr 2>/dev/null \
            | openssl x509 -noout -text 2>/dev/null \
            | grep -A1 "CA Issuers" || true
          echo "=== Sistem ca-certificates guncelle ==="
          sudo apt-get update -qq && sudo apt-get install -y -qq ca-certificates
          echo "=== Python + sistem deposu testi ==="
          python3 -c "
          import requests, os
          os.environ['REQUESTS_CA_BUNDLE']='/etc/ssl/certs/ca-certificates.crt'
          try:
              r=requests.get('https://www.ilan.gov.tr/', timeout=15)
              print('SISTEM DEPOSU ILE:', r.status_code)
          except Exception as e:
              print('SISTEM DEPOSU HATA:', str(e)[:200])
          "

      - name: ilan.gov.tr taramasi
        env:
          RGBOT_FILTRE_JSON: filtre.json
        run: |
          python -m rgbot.toplayici --cikti sonuc.json
          cat sonuc.json

      - name: AWS kimligi (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Sonucu AWS'ye gonder
        run: |
          aws lambda invoke \
            --function-name rgbot-bildirici \
            --cli-binary-format raw-in-base64-out \
            --payload file://sonuc.json \
            cikti.json
          cat cikti.json

      - name: Tarama kaydini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarama-${{ github.run_number }}
          path: |
            sonuc.json
            cikti.json
          retention-days: 30
