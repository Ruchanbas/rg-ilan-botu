name: ilan taramasi

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklar
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Eksik ara sertifikayi ekle
        run: |
          # ilan.gov.tr, GeoTrust TLS RSA CA G1 ara sertifikasini SUNMUYOR.
          # Resmi adresten (DER formatinda) indirip PEM'e cevir, certifi
          # bundle'inin sonuna ekle, requests'e bu genisletilmis bundle'i
          # kullandir.
          CERTIFI=$(python3 -c "import certifi; print(certifi.where())")
          cp "$CERTIFI" /tmp/ca-genisletilmis.pem
          curl -s http://cacerts.geotrust.com/GeoTrustTLSRSACAG1.crt \
            -o /tmp/ara.crt
          openssl x509 -inform DER -in /tmp/ara.crt >> /tmp/ca-genisletilmis.pem
          echo "Genisletilmis bundle hazir."
          # Dogrula
          python3 -c "
          import requests
          r=requests.get('https://www.ilan.gov.tr/', timeout=15,
                         verify='/tmp/ca-genisletilmis.pem')
          print('DOGRULAMA:', r.status_code)
          "

      - name: ilan.gov.tr taramasi
        env:
          RGBOT_FILTRE_JSON: filtre.json
          RGBOT_CA_BUNDLE: /tmp/ca-genisletilmis.pem
        run: |
          python -m rgbot.toplayici --cikti sonuc.json
          cat sonuc.json

      - name: AWS kimligi (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Sonucu AWS'ye gonder
        run: |
          aws lambda invoke \
            --function-name rgbot-bildirici \
            --cli-binary-format raw-in-base64-out \
            --payload file://sonuc.json \
            cikti.json
          cat cikti.json

      - name: Tarama kaydini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarama-${{ github.run_number }}
          path: |
            sonuc.json
            cikti.json
          retention-days: 30
