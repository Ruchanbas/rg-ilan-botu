name: ilan taramasi

on:
  schedule:
    # GitHub cron UTC. 06:00 UTC = 09:00 TRT, 15:00 UTC = 18:00 TRT
    - cron: "0 6 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  id-token: write   # OIDC icin
  contents: read

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklar
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: ilan.gov.tr taramasi
        env:
          RGBOT_FILTRE_JSON: filtre.json
        run: |
          python -m rgbot.toplayici --cikti sonuc.json
          cat sonuc.json

      - name: OIDC token iddialarini incele
        run: |
          C=$(curl -sS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | \
            python3 -c "import sys,json,base64; t=json.load(sys.stdin)['value'].split('.')[1]; t+='='*(-len(t)%4); print(base64.urlsafe_b64decode(t).decode())")
          echo "$C" | python3 -m json.tool | grep -E '"(sub|aud|repository|iss)"'

      - name: AWS kimligi (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Sonucu AWS'ye gonder
        run: |
          aws lambda invoke \
            --function-name rgbot-bildirici \
            --cli-binary-format raw-in-base64-out \
            --payload file://sonuc.json \
            cikti.json
          cat cikti.json

      - name: Tarama kaydini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarama-${{ github.run_number }}
          path: |
            sonuc.json
            cikti.json
          retention-days: 30
