name: ilan.gov.tr kesif
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Swagger indir ve AdsByFilter semasini cikar
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          curl -sk -A "$UA" --max-time 30 "https://www.ilan.gov.tr/api/swagger/v1/swagger.json" -o sw.json -w "kod=%{http_code} boyut=%{size_download}\n"
          python3 - <<'PYEOF'
          import json
          sw = json.load(open("sw.json"))
          defs = sw.get("definitions") or sw.get("components", {}).get("schemas", {})
          cikti = {}
          for p, ops in sw.get("paths", {}).items():
              if "AdsByFilter" in p or "GetAdDetail" in p:
                  cikti[p] = ops
          ilgili = {k: v for k, v in defs.items()
                    if any(s in k.lower() for s in ["filter", "adlistdto", "addto", "pagedresult"])}
          json.dump({"paths": cikti, "tanimlar": ilgili},
                    open("sema.json", "w"), ensure_ascii=False, indent=1)
          print("sema.json yazildi,", len(ilgili), "tanim")
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: kesif6
          path: sema.json
