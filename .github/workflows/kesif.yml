name: ilan.gov.tr kesif
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Sayfalari indir
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          echo "== varsayilan UA ==" | tee ozet.txt
          curl -sk -o /dev/null -w "kod=%{http_code} sure=%{time_total}s\n" --max-time 20 "https://www.ilan.gov.tr/" | tee -a ozet.txt || true
          echo "== tarayici UA anasayfa ==" | tee -a ozet.txt
          curl -sk -A "$UA" -o anasayfa.html -w "kod=%{http_code} sure=%{time_total}s boyut=%{size_download}\n" --max-time 20 "https://www.ilan.gov.tr/" | tee -a ozet.txt || true
          echo "== tarayici UA kategori ==" | tee -a ozet.txt
          curl -sk -A "$UA" -o kategori.html -w "kod=%{http_code} sure=%{time_total}s boyut=%{size_download}\n" --max-time 20 "https://www.ilan.gov.tr/ilan/kategori/8/kamu-akademik-personel" | tee -a ozet.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: kesif
          path: |
            ozet.txt
            anasayfa.html
            kategori.html
