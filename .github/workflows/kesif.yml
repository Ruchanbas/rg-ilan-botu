name: ilan.gov.tr kesif
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: API adresini bul
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

          echo "== appconfig dosyalari ==" | tee ozet.txt
          for f in appconfig.production.json appconfig.json config.json; do
            echo "-- assets/$f --" | tee -a ozet.txt
            curl -sk -A "$UA" --max-time 20 "https://www.ilan.gov.tr/assets/$f" \
              -o "$f" -w "kod=%{http_code} boyut=%{size_download}\n" | tee -a ozet.txt
            cat "$f" 2>/dev/null | head -c 1200 | tee -a ozet.txt; echo | tee -a ozet.txt
          done

          echo "== main.js icinde gov.tr adresleri (tam liste) ==" | tee -a ozet.txt
          curl -sk -A "$UA" -o main.js --max-time 60 "https://www.ilan.gov.tr/main-es2015.cbf38031e623f595be7a.js"
          grep -oE 'https?://[a-zA-Z0-9.-]*gov\.tr[a-zA-Z0-9./_-]*' main.js | sort -u | tee -a ozet.txt

          echo "== remoteServiceBaseUrl / baseUrl gecen yerler ==" | tee -a ozet.txt
          grep -oE '.{0,60}(remoteServiceBaseUrl|baseUrl|apiUrl).{0,80}' main.js | head -20 | tee -a ozet.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kesif4
          path: ozet.txt
