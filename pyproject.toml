[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgbot"
version = "0.1.0"
description = "Resmî Gazete FTR araştırma görevlisi ilan takibi"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
]

[project.scripts]
rgbot-backfill = "rgbot.backfill:main"

[tool.setuptools.packages.find]
where = ["src"]
